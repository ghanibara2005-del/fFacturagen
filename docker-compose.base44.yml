name: ffacturagen

services:
  db:
    image: postgres:16-alpine
    restart: on-failure
    environment:
      POSTGRES_USER: ffacturagen
      POSTGRES_PASSWORD: ffacturagen
      POSTGRES_DB: ffacturagen
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ffacturagen -d ffacturagen"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  web:
    image: node:22-alpine
    restart: on-failure
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=postgres://ffacturagen:ffacturagen@db:5432/ffacturagen
      - BASE44_PREVIEW_MODE
      - BASE44_SANDBOX_HOST_DOMAIN
      - BASE44_PUBLIC_HOST_SUFFIX
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command:
      ["sh", "-ec", "npm ci --no-audit --no-fund && exec npm run dev"]
    labels:
      base44.project: "fFacturagen"
      base44.kind: "web"
      base44.port: "3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/api/clients').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

volumes:
  db_data:
  node_modules:
